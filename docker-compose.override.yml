services:
  app:
    volumes:
      - ./app:/app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    command: ["make", "dev"]

  caddy:
    image: caddy:2
    ports:
      - 443:443
      - 80:80
    depends_on:
      - app
    volumes:
      - $PWD/services/caddy:/etc/caddy